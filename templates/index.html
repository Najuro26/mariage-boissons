<style>

    .header {

    .boisson-card {

        transition: transform 0.2s;
    }

    .boisson-card:hover {

    }

    .boisson-image {
        width: 100%;
        height: 180px;
        object-fit: contain;
        background: #ffffff;
        padding: 10px;
    }

    .boisson-content {
        padding: 15px;
    }

    .boisson-nom {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .quantite {
        width: 90px;
    }

    .btn-commander {
        width: 100%;
        padding: 15px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 12px;

</style>

<script>

function augmenter(id) {

    let champ = document.getElementById(id);

    let valeur = parseInt(champ.value) || 0;

    if (valeur < 10) {
        champ.value = valeur + 1;
    }
}

function diminuer(id) {

    let champ = document.getElementById(id);

    let valeur = parseInt(champ.value) || 0;

    if (valeur > 0) {
        champ.value = valeur - 1;
    }
}

</script>
