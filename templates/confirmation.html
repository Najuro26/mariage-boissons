<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande enregistrée</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --vert-mariage: #176B3A;
            --orange-mariage: #F28C28;
            --fond: #F7FAF7;
        }

        body {
            background: var(--fond);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirmation-card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .icone {
            font-size: 90px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--vert-mariage);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .message {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 25px;
        }

        .badge-mariage {
            background: var(--orange-mariage);
            color: white;
            font-size: 1rem;
            padding: 10px 18px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 25px;
        }

        .btn-retour {
            background: var(--vert-mariage);
            border: none;
            padding: 14px 25px;
            font-size: 1.1rem;
            border-radius: 12px;
        }

        .btn-retour:hover {
            background: #0F4D2A;
        }
    </style>
</head>

<body>

<div class="confirmation-card">

    <div class="icone">💍✅</div>

    <h1>Commande enregistrée</h1>

    <div class="badge-mariage">
        Louis Godin & Françoise
    </div>

    <p class="message">
        Votre commande a bien été transmise au bar.
        Une hôtesse vous servira dès qu'elle sera prête.
    </p>

    <a href="/" class="btn btn-success btn-retour">
        🍹 Nouvelle commande
    </a>

</div>

</body>
</html>
